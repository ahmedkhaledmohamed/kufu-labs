name: Lab verification and delivery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  VERCEL_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  PIP_INDEX_URL: https://pypi.org/simple
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  contracts:
    name: Pinned scientific software contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      QT_API: pyqt6
      CUDA_VISIBLE_DEVICES: ""
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Prepare exact source checkouts, without recordings
        run: python site/prepare_movement.py
      - name: Install host contracts and CPU numerical runtime
        run: |
          python -m pip install --disable-pip-version-check -c site/requirements-ci.txt -e '.external/movement-patched[napari]' attrs==26.1.0 numpy==2.5.4
          python -m pip install --disable-pip-version-check torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Run actual filter oracle and host workflow
        run: |
          mkdir -p .runs/contracts
          python projects/overlap-inspector/generate.py --source .external/overlap-oracle --fetch > .runs/contracts/overlap.json
          python projects/movement-edit-filtering/verify_workflow.py --checkout .external/movement-patched --output .runs/contracts/movement.json > .runs/contracts/movement.log 2>&1
          python projects/movement-edit-filtering/reproduce_deleted_flags.py --checkout .external/movement-clean --output .runs/contracts/deletion.json > .runs/contracts/deletion.log 2>&1
          python -m pip freeze > .runs/contracts/environment.txt
      - name: Retain scientific evidence and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scientific-evidence
          path: .runs/contracts
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
      - name: Pass the actual CPU-generated demo to the web build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oracle-bundle
          path: |
            projects/overlap-inspector/index.html
            projects/overlap-inspector/verification.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

  web:
    name: Build and browser verification
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oracle-bundle
          path: projects/overlap-inspector
      - name: Install locked tooling
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install ruff==0.16.10
          npx --no-install playwright install --with-deps chromium
      - name: Lint, package and exercise the actual site
        run: |
          ruff check site/build.py site/package.py site/prepare_movement.py projects/overlap-inspector/generate.py
          ruff format --check site/build.py site/package.py site/prepare_movement.py projects/overlap-inspector/generate.py
          npm run lint
          node --check site/app.js
          node --check site/deploy.cjs
          npm run build
          npm test
          DEMO_OUTPUT=.runs/overlap npm run test:overlap
      - name: Retain the exact tested site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-site
          path: dist
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
      - name: Retain browser reports, screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence
          path: .runs
          retention-days: 14
          include-hidden-files: true

  deploy:
    name: Protected Vercel deployment
    needs: [contracts, web]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: vercel-lab-${{ github.ref == 'refs/heads/main' && 'production' || github.ref }}
      cancel-in-progress: false
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-site
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: browser-evidence
          path: .runs
      - name: Verify target, deploy, verify remotely and promote main
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: node site/deploy.cjs ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      - name: Retain deployed browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-evidence
          path: .runs
          retention-days: 14
          include-hidden-files: true
