name: Lab verification and delivery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  VERCEL_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  PIP_INDEX_URL: https://pypi.org/simple
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  contracts:
    name: Pinned scientific software contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      QT_API: pyqt6
      CUDA_VISIBLE_DEVICES: ""
      GIT_LFS_SKIP_SMUDGE: "1"
      NWBI_SKIP_NETWORK_TESTS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            site/requirements-ci.txt
            projects/nwb-stream-integrity/requirements.txt
            .github/workflows/lab-delivery.yml
      - name: Prepare exact source checkouts, without recordings
        run: |
          python site/prepare_movement.py
          python site/prepare_movement.py --deletion
          python projects/nwb-stream-integrity/prepare.py
          python projects/nwb-stream-integrity/prepare.py --released
      - name: Install host contracts and CPU numerical runtime
        run: |
          python -m pip install --disable-pip-version-check -c site/requirements-ci.txt -e '.external/movement-patched[napari]' attrs==26.1.0 numpy==2.5.4 pytest pytest-qt pytest-mock
          python -m pip install --disable-pip-version-check torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 xvfb xauth libgl1-mesa-dri libglx-mesa0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - name: Run actual filter oracle and host workflow
        run: |
          mkdir -p .runs/contracts
          python projects/overlap-inspector/generate.py --source .external/overlap-oracle --fetch > .runs/contracts/overlap.json
          python projects/movement-edit-filtering/verify_workflow.py --checkout .external/movement-patched --output .runs/contracts/movement.json > .runs/contracts/movement.log 2>&1
          QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1400x1000x24' python projects/movement-edit-filtering/verify_workflow.py --checkout .external/movement-patched --output .runs/contracts/rendered/result.json --rendered > .runs/contracts/rendered.log 2>&1
          python projects/movement-edit-filtering/reproduce_deleted_flags.py --checkout .external/movement-clean --output .runs/contracts/deletion.json > .runs/contracts/deletion.log 2>&1
          python -m pip freeze > .runs/contracts/environment.txt
      - name: Verify saved movement deletion provenance
        run: |
          python projects/movement-edit-filtering/verify_deletion.py --checkout .external/movement-deletion-clean --expect baseline --output .runs/contracts/movement-deletion/baseline.json
          python projects/movement-edit-filtering/verify_deletion.py --checkout .external/movement-deletion-patched --expect patched --output .runs/contracts/movement-deletion/patched.json
          PYTHONPATH="$PWD/.external/movement-deletion-patched" QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1400x1000x24' python -m pytest --noconftest -o addopts= -p tests.fixtures.datasets -p tests.fixtures.napari .external/movement-deletion-patched/tests/test_unit/test_napari_plugin/test_convert.py -q --junitxml=.runs/contracts/movement-deletion/existing-conversion.xml
      - name: Install isolated NWB runtime
        run: |
          python -m venv .external/nwb-env
          .external/nwb-env/bin/python -m pip install --disable-pip-version-check -r projects/nwb-stream-integrity/requirements.txt
          .external/nwb-env/bin/python -m pip install --disable-pip-version-check --no-deps -e .external/nwb-patched
      - name: Reproduce NWB data loss and verify preservation
        run: |
          mkdir -p .runs/contracts/nwb
          PYTHONPATH=.external/nwb-clean/src .external/nwb-env/bin/python projects/nwb-stream-integrity/verify.py --expect baseline --output .runs/contracts/nwb/baseline.json
          PYTHONPATH=.external/nwb-patched/src .external/nwb-env/bin/python projects/nwb-stream-integrity/verify.py --expect patched --output .runs/contracts/nwb/patched.json
          python -c 'import json; from pathlib import Path; cases=[dict(rows=rows,channels=channels,buffer=buffer,seed=seed,pattern=pattern,backend=backend,iterator=iterator) for rows,channels,buffer,seed,pattern,backend,iterator in [(1,1,1,0,"ramp","hdf5","basic"),(101,3,50,42,"random","zarr","generic"),(2000,8,500,2147483647,"alternating","hdf5","generic"),(499,2,100,123,"random","zarr","basic")]]; Path(".runs/contracts/nwb/inputs.json").write_text(json.dumps(cases))'
          PYTHONPATH=.external/nwb-clean/src .external/nwb-env/bin/python projects/nwb-stream-integrity/experiment.py --mode baseline --input .runs/contracts/nwb/inputs.json --output .runs/contracts/nwb/parameterized-baseline
          PYTHONPATH=.external/nwb-patched/src .external/nwb-env/bin/python projects/nwb-stream-integrity/experiment.py --mode patched --input .runs/contracts/nwb/inputs.json --output .runs/contracts/nwb/parameterized-patched
          cd .external/nwb-patched
          ../nwb-env/bin/python -m pytest tests/unit_tests tests/test_stream_shape.py -q --junitxml=../../.runs/contracts/nwb/unit-tests.xml
          ../nwb-env/bin/ruff check src/nwbinspector/utils/_utils.py tests/test_stream_shape.py
          ../nwb-env/bin/black --check src/nwbinspector/utils/_utils.py tests/test_stream_shape.py
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.12"
      - name: Verify the public NWB release on the reported library versions
        run: |
          python -m venv .external/nwb-release-env
          .external/nwb-release-env/bin/python -m pip install --disable-pip-version-check -r projects/nwb-stream-integrity/requirements.txt
          .external/nwb-release-env/bin/python -m pip install --disable-pip-version-check --no-deps -e .external/nwb-release-clean
          PYTHONPATH=.external/nwb-release-clean/src .external/nwb-release-env/bin/python projects/nwb-stream-integrity/verify.py --released --expect baseline --output .runs/contracts/nwb-release/baseline.json
          PYTHONPATH=.external/nwb-release-patched/src .external/nwb-release-env/bin/python projects/nwb-stream-integrity/verify.py --released --expect patched --output .runs/contracts/nwb-release/patched.json
          .external/nwb-release-env/bin/python projects/nwb-stream-integrity/verify_release_units.py --output .runs/contracts/nwb-release
          .external/nwb-release-env/bin/ruff check .external/nwb-release-patched/src/nwbinspector/utils/_utils.py .external/nwb-release-patched/tests/test_stream_shape.py
          .external/nwb-release-env/bin/black --check .external/nwb-release-patched/src/nwbinspector/utils/_utils.py .external/nwb-release-patched/tests/test_stream_shape.py
      - name: Retain scientific evidence and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scientific-evidence
          path: .runs/contracts
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
      - name: Pass the actual CPU-generated demo to the web build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oracle-bundle
          path: |
            projects/overlap-inspector/index.html
            projects/overlap-inspector/verification.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

  refinebio:
    name: Pinned refine.bio metadata workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare source-only pinned baseline and patch
        run: python3 projects/refinebio-zero-age/prepare.py
      - name: Build the upstream Linux and R runtime
        run: |
          mkdir -p .runs/refinebio
          chmod 777 .runs/refinebio
          docker build --platform linux/amd64 --progress plain --tag kufu/refinebio-base:7b809b7 --file .external/refinebio-clean/common/dockerfiles/Dockerfile.base .external/refinebio-clean > .runs/refinebio/base-build.log 2>&1
          docker build --platform linux/amd64 --progress plain --tag kufu/refinebio-metadata:7b809b7 --build-arg FIXTURE_UID="$(id -u)" --file projects/refinebio-zero-age/Worker.Dockerfile .external/refinebio-clean > .runs/refinebio/worker-build.log 2>&1
          docker image inspect --format '{{.Id}}' kufu/refinebio-base:7b809b7 kufu/refinebio-metadata:7b809b7 > .runs/refinebio/image-ids.txt
      - name: Execute actual SRA record creation and metadata export
        run: |
          docker run --rm --platform linux/amd64 --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 4g --cpus 2 --tmpfs /tmp:rw,exec,size=1g --env HOME=/tmp --volume "$PWD:$PWD:ro" --volume "$PWD/.runs/refinebio:$PWD/.runs/refinebio:rw" --workdir "$PWD" kufu/refinebio-metadata:7b809b7 python3 "$PWD/projects/refinebio-zero-age/verify_postgres.py" --workflow export --postgres-bin /usr/lib/postgresql/14/bin --clean-checkout "$PWD/.external/refinebio-clean" --patched-checkout "$PWD/.external/refinebio-patched" --output-dir "$PWD/.runs/refinebio" > .runs/refinebio/workflow.log 2>&1
      - name: Retain workflow results, actual exports and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: refinebio-evidence
          path: .runs/refinebio
          if-no-files-found: error
          retention-days: 14

  web:
    name: Build and browser verification
    needs: [contracts, refinebio]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oracle-bundle
          path: projects/overlap-inspector
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scientific-evidence
          path: .runs/contracts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: refinebio-evidence
          path: .runs/refinebio
      - name: Publish the scientific results generated by this run
        run: |
          cp .runs/contracts/movement-deletion/baseline.json projects/movement-edit-filtering/deletion-baseline.json
          cp .runs/contracts/movement-deletion/patched.json projects/movement-edit-filtering/deletion-patched.json
          cp .runs/contracts/nwb/baseline.json projects/nwb-stream-integrity/baseline.json
          cp .runs/contracts/nwb/patched.json projects/nwb-stream-integrity/patched.json
          cp .runs/contracts/nwb-release/baseline.json projects/nwb-stream-integrity/released-baseline.json
          cp .runs/contracts/nwb-release/patched.json projects/nwb-stream-integrity/released-patched.json
          cp .runs/contracts/nwb-release/unit-comparison.json projects/nwb-stream-integrity/released-unit-comparison.json
          cp .runs/refinebio/postgres-baseline.json projects/refinebio-zero-age/postgres-baseline.json
          cp .runs/refinebio/postgres-patched.json projects/refinebio-zero-age/postgres-patched.json
          cp .runs/contracts/rendered/result.json projects/movement-edit-filtering/rendered-result.json
          cp .runs/contracts/rendered/canvas/before.png projects/movement-edit-filtering/canvas-before.png
          cp .runs/contracts/rendered/canvas/after-drag.png projects/movement-edit-filtering/canvas-after-drag.png
          cp .runs/contracts/rendered/canvas/after-filter-reload.png projects/movement-edit-filtering/canvas-after-filter.png
      - name: Install locked tooling
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install ruff==0.16.10
          npx --no-install playwright install --with-deps chromium
      - name: Lint, package and exercise the actual site
        run: |
          ruff check site/build.py site/package.py site/prepare_movement.py projects/overlap-inspector/generate.py projects/nwb-stream-integrity/prepare.py projects/nwb-stream-integrity/verify.py projects/nwb-stream-integrity/verify_release_units.py projects/nwb-stream-integrity/experiment.py projects/refinebio-zero-age/*.py
          ruff format --check site/build.py site/package.py site/prepare_movement.py projects/overlap-inspector/generate.py projects/nwb-stream-integrity/prepare.py projects/nwb-stream-integrity/verify.py projects/nwb-stream-integrity/verify_release_units.py projects/nwb-stream-integrity/experiment.py projects/refinebio-zero-age/*.py
          ruff check projects/movement-edit-filtering/verify_workflow.py projects/movement-edit-filtering/verify_deletion.py
          ruff format --check projects/movement-edit-filtering/verify_workflow.py projects/movement-edit-filtering/verify_deletion.py
          npm run lint
          node --check site/app.js
          node --check site/deploy.cjs
          npm run build
          node lab/verify.cjs
          node lab/verify-browser.cjs
          npm test
          DEMO_OUTPUT=.runs/overlap npm run test:overlap
      - name: Retain the exact tested site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-site
          path: dist
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
      - name: Retain the exact tested execution backend
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-backend
          path: dist-backend
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
      - name: Retain browser reports, screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence
          path: .runs
          retention-days: 14
          include-hidden-files: true

  deploy:
    name: Protected Vercel deployment
    needs: [contracts, refinebio, web]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: vercel-lab-${{ github.ref == 'refs/heads/main' && 'production' || github.ref }}
      cancel-in-progress: false
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-site
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-backend
          path: dist-backend
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: browser-evidence
          path: .runs
      - name: Verify target, deploy, verify remotely and promote main
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: node site/deploy.cjs ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      - name: Retain deployed browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-evidence
          path: .runs
          retention-days: 14
          include-hidden-files: true
